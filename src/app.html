<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF1E4" />
    <script data-url-fragment-guard>
      (function() {
        function normalizeFragment() {
          try { decodeURIComponent(location.hash); }
          catch (_) { history.replaceState(history.state, '', location.pathname + location.search); }
        }
        // Run before the router decodes the initial URL or a history change.
        normalizeFragment();
        window.addEventListener('hashchange', normalizeFragment);
        window.addEventListener('popstate', normalizeFragment);
      })();
    </script>
    <link rel="icon" href="/assets/branding/tu-tap-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" />
    </noscript>
    <script>
      (function() {
        if ((window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) ||
            (location.protocol === 'https:' && location.hostname === 'localhost')) {
          document.documentElement.setAttribute('data-native-app', 'true');
          if (window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'android' &&
              window.Capacitor.isPluginAvailable && window.Capacitor.isPluginAvailable('AppSystemBars')) {
            document.documentElement.setAttribute('data-native-insets', 'true');
          }
          if (window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'android' &&
              window.Capacitor.isPluginAvailable && window.Capacitor.isPluginAvailable('StartupScreen')) {
            document.documentElement.setAttribute('data-native-startup', 'true');
          }
          var backgrounds = ['lotus-dawn', 'temple-mist', 'bamboo-path', 'bodhi-leaves', 'stupa-moon', 'incense-lotus', 'rosary-stillness', 'lotus-lanterns', 'zen-garden', 'pagoda-hills'];
          var backgroundIndex = 0;
          try {
            var previous = Number(localStorage.getItem('tutam_startup_background_index') ?? '-1');
            backgroundIndex = (Number.isInteger(previous) && previous >= 0 && previous < backgrounds.length ? previous + 1 : 0) % backgrounds.length;
            localStorage.setItem('tutam_startup_background_index', String(backgroundIndex));
          } catch (e) {}
          document.documentElement.style.setProperty('--startup-artwork', 'url("/images/calendar/' + backgrounds[backgroundIndex] + '.webp")');
        }
        try {
          var savedUiFontScale = localStorage.getItem('tutam_ui_font_scale');
          var uiFontScale = Number(savedUiFontScale && savedUiFontScale.trim() ? savedUiFontScale : '1');
          if (!Number.isFinite(uiFontScale)) uiFontScale = 1;
          uiFontScale = Math.round(Math.min(1.2, Math.max(0.9, uiFontScale)) * 10) / 10;
          document.documentElement.style.setProperty('--ui-font-scale', String(uiFontScale));
        } catch (e) {}
        try {
          var mode = localStorage.getItem('tutam_dark_mode');
          var isDark = mode === '1' || (mode !== '0' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.backgroundColor = '#15120d';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#15120d');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      :root[data-theme='dark'], html[data-theme='dark'], html[data-theme='dark'] body {
        background-color: #15120d !important;
        color: #e6dfd5;
      }
      :root, html, body {
        background-color: #FAF1E4;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
    <style>
      #app-startup { display: none; }
      html[data-native-app='true'] #app-startup {
        position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center;
        background: #fffaf2 var(--startup-artwork, none) center / cover no-repeat;
        color: #28594f; opacity: 1; transition: opacity 220ms ease-out;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #app-startup .startup-brand { box-sizing: border-box; width: min(340px, calc(100vw - 40px)); text-align: center; margin-top: -6vh; padding: 28px 24px; border: 1px solid #ffffffb3; border-radius: 28px; background: rgba(255, 250, 242, .88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 16px 48px #39281924; animation: startup-arrive 500ms ease-out both; }
      #app-startup img { display: block; width: clamp(104px, 28vw, 136px); height: auto; margin: 0 auto 22px; }
      #app-startup strong { display: block; font-size: clamp(30px, 8vw, 38px); font-weight: 750; letter-spacing: -.5px; line-height: 1.25; }
      #app-startup p { margin: 12px 0 0; color: #63715e; font-size: 14px; line-height: 1.6; }
      html[data-native-app='true'] #app-startup.startup-ready { opacity: 0; pointer-events: none; }
      @keyframes startup-arrive { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @media (orientation: landscape) and (max-height: 540px) {
        #app-startup .startup-brand { margin-top: 0; }
        #app-startup img { width: 84px; margin-bottom: 12px; }
        #app-startup strong { font-size: 28px; }
        #app-startup p { margin-top: 6px; font-size: 12px; }
      }
      @media (prefers-reduced-motion: reduce) { #app-startup .startup-brand { animation: none; } html[data-native-app='true'] #app-startup { transition: none; } }
    </style>
    <style>
      html[data-native-startup='true'] #app-startup { display: none; }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="app-startup" role="status" aria-label="Tu tập Phật pháp">
      <div class="startup-brand">
        <img data-startup-logo alt="" width="160" height="160" />
        <strong>Tu tập Phật pháp</strong>
        <p data-startup-tagline>Học lời Phật dạy · Thực hành mỗi ngày</p>
      </div>
    </div>
    <script>
      if (document.documentElement.dataset.nativeStartup === 'true') {
        document.getElementById('app-startup').remove();
      } else if (document.documentElement.dataset.nativeApp === 'true') {
        document.querySelector('[data-startup-logo]').src = '/assets/branding/lotus-mark.png';
        try { if (localStorage.getItem('tutam_locale') === 'en') document.querySelector('[data-startup-tagline]').textContent = 'Learn the Buddha’s teachings · Practice every day'; } catch (e) {}
      }
      // A recoverable startup error must never leave a permanent cover over the app.
      window.setTimeout(function() { var screen = document.getElementById('app-startup'); if (screen) screen.remove(); }, 15000);
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
