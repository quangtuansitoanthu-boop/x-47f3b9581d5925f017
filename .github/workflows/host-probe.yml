name: Simulator Host Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    name: probe-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26-intel, xcode-27]
    steps:
      - name: Check preinstalled Apple toolchain and CoreSimulator
        run: |
          mkdir -p evidence
          xcodebuild -version
          python3 - <<'PY'
          import subprocess, json, pathlib, time, os
          started=time.monotonic()
          report={'runner':os.environ.get('RUNNER_OS'),'arch':os.environ.get('RUNNER_ARCH')}
          try:
              data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json'],timeout=180))
              report['seconds']=round(time.monotonic()-started,1)
              report['devices']=data
              report['success']=True
              pathlib.Path('evidence/probe.json').write_text(json.dumps(report,indent=2))
              print('CoreSimulator list succeeded in',report['seconds'],'seconds')
          except Exception as error:
              report['success']=False
              report['error']=str(error)
              pathlib.Path('evidence/probe.json').write_text(json.dumps(report,indent=2))
              raise
          PY
      - name: Save simulator host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-probe-${{ matrix.os }}
          path: evidence/
          retention-days: 3
