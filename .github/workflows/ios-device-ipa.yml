name: Build signed IPA

on:
  workflow_dispatch:
  push:
    branches: [codex/ios-rosary-audio-qa-20261112]

permissions:
  contents: read

concurrency:
  group: signed-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      VITE_GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
      VITE_ROSARY_STARTUP_QA: '1'
      TUTAM_BUNDLE_SYNCED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Set independent build number
        run: echo "BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          pod --version
      - name: Install and verify existing signing credentials
        env:
          CERT_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          signing="$RUNNER_TEMP/tutap-signing"
          mkdir -p "$signing" "$HOME/Library/MobileDevice/Provisioning Profiles"
          for value in "$CERT_BASE64" "$CERT_PASSWORD" "$PROFILE_BASE64" "$WIDGET_PROFILE_BASE64"; do
            test -n "$value" || { echo '::error::Missing signing secret'; exit 1; }
          done
          printf '%s' "$CERT_BASE64" | base64 --decode > "$signing/certificate.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$signing/profile.mobileprovision"
          printf '%s' "$WIDGET_PROFILE_BASE64" | base64 --decode > "$signing/widget.mobileprovision"
          security cms -D -i "$signing/profile.mobileprovision" > "$signing/profile.plist"
          security cms -D -i "$signing/widget.mobileprovision" > "$signing/widget.plist"
          python3 - <<'PY'
          import os, pathlib, plistlib, datetime, json
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'tutap-signing'
          profiles={}
          certificates=[]
          for stem,bundle in [('profile','vn.quangtu.tutam'),('widget','vn.quangtu.tutam.calendarwidget')]:
              p=plistlib.loads((root/(stem+'.plist')).read_bytes())
              assert p['TeamIdentifier']==['VTU998VP63']
              ent=p['Entitlements']
              assert ent['application-identifier']=='VTU998VP63.'+bundle
              assert ent['get-task-allow'] is False
              assert 'group.vn.quangtu.tutam.calendar' in ent.get('com.apple.security.application-groups',[])
              assert p['ExpirationDate'] > datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)
              if stem=='profile':
                  assert 'Default' in ent.get('com.apple.developer.applesignin',[])
              certificates.append(set(p['DeveloperCertificates']))
              dest=pathlib.Path.home()/'Library/MobileDevice/Provisioning Profiles'/(p['UUID']+'.mobileprovision')
              dest.write_bytes((root/(stem+'.mobileprovision')).read_bytes())
              profiles[bundle]=p['Name']
              print('Verified App Store profile for '+bundle)
          assert certificates[0].intersection(certificates[1]), 'App and widget need the same distribution certificate'
          (root/'profiles.json').write_text(json.dumps(profiles))
          options={'method':'app-store-connect','destination':'export','teamID':'VTU998VP63','signingStyle':'manual','signingCertificate':'Apple Distribution','provisioningProfiles':profiles,'manageAppVersionAndBuildNumber':False,'stripSwiftSymbols':True,'uploadSymbols':True}
          (root/'ExportOptions.plist').write_bytes(plistlib.dumps(options))
          PY
          keychain="$signing/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing/certificate.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$keychain" | grep 'Apple Distribution: SMOB JOINT STOCK COMPANY'
      - name: Install locked dependencies
        run: npm ci
      - name: Check TypeScript and native bridge contracts
        run: |
          npm run check
          npx vitest run --config tests/unit/vitest.config.ts tests/unit/audio/native-platform-parity.test.ts tests/unit/audio/native-talk-audio.test.ts tests/unit/audio/native-player-controller.test.ts tests/unit/audio/audio-player-controller.test.ts
          npx vitest run --config tests/unit/vitest.config.ts tests/unit/facebook-limited-token.test.ts tests/unit/facebook-limited-identity.test.ts tests/unit/native-auth-security.test.ts tests/unit/native-login-transport.test.ts
      - name: Build iOS web assets and install native dependencies
        run: npm run build:mobile -- --platform ios
      - name: Archive signed iOS release once
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, json, re
          p=pathlib.Path('ios/App/App.xcodeproj/project.pbxproj')
          s=p.read_text()
          profiles=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'tutap-signing/profiles.json').read_text())
          replacements=[]
          for bundle,name in profiles.items():
              assert re.fullmatch(r'[A-Za-z0-9 ._-]+',name), 'Unexpected profile name'
              matches=list(re.finditer(re.escape('PRODUCT_BUNDLE_IDENTIFIER = '+bundle+';'),s))
              assert len(matches)==2, 'Expected Debug and Release for '+bundle
              for match in matches:
                  block=s.rfind('buildSettings = {',0,match.start())
                  start=s.rfind('CODE_SIGN_STYLE = Automatic;',block,match.start())
                  assert block>=0 and start>=block, 'Signing settings missing for '+bundle
                  value='CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = VTU998VP63; CODE_SIGN_IDENTITY = "Apple Distribution"; PROVISIONING_PROFILE_SPECIFIER = "'+name+'";'
                  replacements.append((start,start+len('CODE_SIGN_STYLE = Automatic;'),value))
          assert len(replacements)==4 and s.count('CODE_SIGN_STYLE = Automatic;')==4
          for start,end,value in sorted(replacements,reverse=True):
              s=s[:start]+value+s[end:]
          p.write_text(s)
          PY
          xcodebuild -quiet -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TuTap.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" archive
          app="$RUNNER_TEMP/TuTap.xcarchive/Products/Applications/App.app"
          codesign --verify --deep --strict "$app"
          test -d "$app/PlugIns/CalendarWidget.appex"
          codesign --verify --strict "$app/PlugIns/CalendarWidget.appex"
          for bundle in GoogleSignIn.bundle GTMAppAuth_Privacy.bundle GTMSessionFetcher_Core_Privacy.bundle AppAuthCore_Privacy.bundle; do
            test -n "$(find "$app" -path "*/$bundle/PrivacyInfo.xcprivacy" -print -quit)"
          done
          while IFS= read -r manifest; do plutil -lint "$manifest"; done < <(find "$app" -name PrivacyInfo.xcprivacy -print)
          grep -q 'GoogleSignIn (7.1.0)' ios/App/Podfile.lock
          cat ios/App/Podfile.lock
      - name: Export IPA without uploading to Apple
        run: |
          set -euo pipefail
          xcodebuild -quiet -exportArchive -archivePath "$RUNNER_TEMP/TuTap.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/tutap-signing/ExportOptions.plist" -exportPath "$RUNNER_TEMP/tutap-export"
          test -n "$(find "$RUNNER_TEMP/tutap-export" -maxdepth 1 -name '*.ipa' -print -quit)"
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: tutap-device-ipa
          path: ${{ runner.temp }}/tutap-export/*.ipa
          retention-days: 7
      - name: Remove ephemeral signing credentials
        if: always()
        run: |
          signing="$RUNNER_TEMP/tutap-signing"
          if [ -f "$signing/signing.keychain-db" ]; then security delete-keychain "$signing/signing.keychain-db"; fi
          rm -rf "$signing"

